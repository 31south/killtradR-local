[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "killtradR-local"
version = "0.1.0"
description = "Local Ollama-powered market-maker counter-trader for BloFin perps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "blofin>=0.0.7",
  "ccxt>=4.4.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "structlog>=24.2.0",
  "python-dotenv>=1.0.1",
  "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.2,<5",
  "pytest>=8.2,<9",
  "ruff>=0.11,<0.12"
]

[project.scripts]
killtrader = "killtrader.cli:app"

[tool.setuptools.packages.find]
include = ["killtrader*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
