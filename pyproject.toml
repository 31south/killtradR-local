[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "killtradR-local"
version = "0.1.0"
description = "Local Ollama-powered market-maker counter-trader for BloFin perps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "blofin>=0.0.7",
  "ccxt>=4.4.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "structlog>=24.2.0",
  "python-dotenv>=1.0.1",
  "aiosqlite>=0.20.0",
  "pytest>=8.2.0"
]

[project.scripts]
killtrader = "killtrader.cli:app"

[tool.setuptools.packages.find]
include = ["killtrader*"]
