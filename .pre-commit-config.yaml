repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: check-forbidden-terms
        name: check forbidden provider/data terms
        entry: scripts/check_forbidden_terms.sh
        language: script
        files: ^(killtrader|tests)/.*\.py$
        require_serial: true

      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        require_serial: true
